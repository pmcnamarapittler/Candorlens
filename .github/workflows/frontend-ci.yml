name: Frontend CI

on:
  pull_request:
    paths:
      - "MVP UI/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main, master]
    paths:
      - "MVP UI/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "MVP UI"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "MVP UI/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

